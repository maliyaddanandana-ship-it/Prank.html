<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Exchange - Buy Crypto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .note {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Crypto Buy / Sell Portal</h2>
        <form action="process-payment.php" method="POST">
            
            <div class="form-group">
                <label for="crypto-type">Select Cryptocurrency</label>
                <select id="crypto-type" name="crypto_type">
                    <option value="usdt">USDT (Tether)</option>
                    <option value="btc">BTC (Bitcoin)</option>
                    <option value="eth">ETH (Ethereum)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount">Amount you want to buy (USD / LKR)</label>
                <input type="number" id="amount" name="amount" placeholder="Enter amount" required>
            </div>

            <div class="form-group">
                <label for="wallet">Your Crypto Wallet Address</label>
                <input type="text" id="wallet" name="wallet_address" placeholder="Paste your wallet address here" required>
            </div>

            <div class="form-group">
                <label for="bank-slip">Upload Bank Deposit Slip (Payment Proof)</label>
                <input type="file" id="bank-slip" name="bank_slip" accept="image/*" required>
            </div>

            <button type="submit">Complete Order</button>
        </form>
        
        <div class="note">
            * Money must be transferred to our bank account. Once verified, crypto will be sent to your wallet.
        </div>
    </div>

</body>
</html>
